<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./assets/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />


    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@600&family=Open+Sans&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Open+Sans&display=swap"
      rel="stylesheet"
    />

    <title>Coffee-House</title>
    <script type="module" crossorigin src="/assets/main-BeNRTGyr.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/main-BerikIPO.css">
  </head>
  <body data-page="register">
    <div id="app">
      <div class="container centered flex-col align-center">
        <div class="centered">
          <!-- ======================== Header Section ========================-->
          <header
            class="main-header centered flex-row justify-between align-center dark-txt medium-font weight-600 mb-20"
            id="main-header"
          >
            <div class="logo">
              <a href="index.html#"
                ><img src="./assets/logo.svg" alt="coffee house logo"
              /></a>
            </div>
            <nav class="nav-bar" id="nav-bar">
              <ul
                class="nav-items flex-row justify-center align-center gap-40"
                id="nav-items"
              >
                <li>
                  <a
                    class="hover-underline-animation dark-txt medium-font weight-600"
                    href="index.html#slider"
                    >Favorite coffee</a
                  >
                </li>
                <li>
                  <a
                    class="hover-underline-animation dark-txt medium-font weight-600"
                    href="index.html#about"
                    >About</a
                  >
                </li>
                <li>
                  <a
                    class="hover-underline-animation dark-txt medium-font weight-600"
                    href="index.html#mobile-app"
                    >Mobile app</a
                  >
                </li>
                <li>
                  <a
                    class="hover-underline-animation dark-txt medium-font weight-600"
                    href="#footer"
                    >Contact us</a
                  >
                </li>
                <li>
                  <a
                    class="coffee-nav display-none flex-row align-center gap-8 hover-underline-animation"
                    href="menu.html"
                    >Menu<img
                      class="coffee-icon"
                      src="assets/coffee-cup.svg"
                      alt="coffee cup icon"
                  /></a>
                </li>
              </ul>
            </nav>
            <div class="flex-row gap-24 align-center justify-center">
              <!-- Render only if user is logged in or cart is not empty -->
              <div class="cart-icon-wrapper"></div>
              <a
                class="coffee flex-row align-center gap-8 hover-underline-animation"
                href="menu.html"
                >Menu<img
                  class="coffee-icon"
                  src="assets/coffee-cup.svg"
                  alt="coffee cup icon"
              /></a>
            </div>

            <a
              class="burger-menu display-none flex-row justify-center align-center cursor-pointer"
              href="#"
            >
              <!-- Burger menu Line -->
              <div class="burger-lines flex-col gap-8" id="burger-line">
                <span class="top-line"></span>
                <span class="bottom-line"></span>
              </div>
            </a>
          </header>
        </div>

        <!-- ======================== Register Section ========================  -->
        <main
          class="register-section centered flex-col justify-center align-center gap-40"
          id="register"
        >
          <h2
            class="register-section-header txt-align-center dark-txt heading-2-font heading-2-font-mob weight-600"
          >
            Registration
          </h2>

          <form
            class="register-form w-full flex-col justify-center align-center gap-40"
            method="POST"
          >
            <div class="form-inputs-wrapper flex-row gap-24 flex-wrap w-full">
              <!-- Login -->
              <div
                class="input-wrapper input-wrapper--login first-input-wrapper flex-col"
              >
                <label class="input-label" for="login">Login</label>
                <input
                  type="text"
                  name="login"
                  id="login"
                  placeholder="Placeholder"
                  class="input login-input"
                />
                <span
                  class="validation-error login-validation-error display-none"
                ></span>
              </div>
              <!-- Password -->
              <div class="input-wrapper input-wrapper--password flex-col">
                <label class="input-label" for="password">Password</label>
                <input
                  type="password"
                  name="password"
                  id="password"
                  placeholder="Placeholder"
                  class="input password-input"
                />
              </div>
              <!-- Confirm Password -->
              <div
                class="input-wrapper input-wrapper--confirm-password flex-col"
              >
                <label class="input-label" for="confirmPassword"
                  >Confirm Password</label
                >
                <input
                  type="password"
                  name="confirmPassword"
                  id="confirmPassword"
                  placeholder="Placeholder"
                  class="input confirm-password-input"
                  disabled
                />
              </div>
              <!-- City -->
              <div
                class="input-wrapper select-wrapper input-wrapper--city flex-col"
              >
                <label class="input-label" for="city">City</label>
                <select
                  name="city"
                  id="city"
                  class="input select city-select align-center"
                >
                  <button>
                    <selectedcontent class="selected-content"></selectedcontent>
                  </button>
                  <option value="" disabled selected hidden>Placeholder</option>
                  <option class="select-option" value="tbilisi">Tbilisi</option>
                  <option class="select-option" value="milan">Milan</option>
                  <option class="select-option" value="chicago">Chicago</option>
                </select>
              </div>
              <!-- Street -->
              <div
                class="input-wrapper select-wrapper input-wrapper--street flex-col"
              >
                <label class="input-label" for="city">Street</label>
                <select
                  name="street"
                  id="street"
                  class="input select align-center street-select"
                  disabled
                >
                  <button>
                    <selectedcontent class="selected-content"></selectedcontent>
                  </button>
                  <option value="" disabled selected hidden>Placeholder</option>
                  <div class="street-select-options"></div>
                </select>
              </div>
              <!-- House Number -->
              <div class="input-wrapper input-wrapper--house-number flex-col">
                <label class="input-label" for="houseNumber"
                  >House number</label
                >
                <input
                  type="number"
                  name="houseNumber"
                  id="houseNumber"
                  placeholder="Placeholder"
                  class="input input--small house-number-input"
                />
              </div>
              <!-- Pay by -->
              <div class="radio-buttons-wrapper flex-col align-start gap-20">
                <p class="input-label radio-label">Pay by</p>
                <div class="radio-buttons-content flex-row align-center gap-24">
                  <div
                    class="radio-button-wrapper flex-row align-center gap-12"
                  >
                    <input
                      type="radio"
                      name="paymentMethod"
                      id="cash"
                      class="radio-input"
                      value="cash"
                      checked
                    />
                    <label class="input-label" for="cash">Cash</label>
                  </div>

                  <div
                    class="radio-button-wrapper flex-row align-center gap-12"
                  >
                    <input
                      type="radio"
                      name="paymentMethod"
                      id="card"
                      class="radio-input"
                      value="card"
                    />
                    <label class="input-label" for="card">Card</label>
                  </div>
                </div>
              </div>
            </div>

            <button type="submit" class="btn register-btn disabled-btn">
              Registration
            </button>

            <div class="result-message-wrapper"></div>
            <div class="register-spinner-wrapper"></div>
          </form>
        </main>

        <!-- ======================== Footer Section ========================-->
        <footer
          class="footer centered flex-row justify-start align-center gap-100 pd-100 medium-background"
          id="footer"
        >
          <div class="footer-offer flex-col txt-align-left gap-40">
            <h2
              class="footer-header heading-2-font heading-2-font-mob weight-600 light-txt"
            >
              Sip, Savor, Smile.
              <span class="accent">It&apos;s coffee time!</span>
            </h2>
            <div class="social-icons flex-row gap-12">
              <a
                class="social-icon-box flex-row justify-center align-center"
                href="https://twitter.com/"
                target="_blank"
              >
                <svg
                  width="24"
                  height="24"
                  viewBox="0 0 24 24"
                  fill="none"
                  xmlns="http://www.w3.org/2000/svg"
                >
                  <path
                    d="M23 3.01006C23 3.01006 20.9821 4.20217 19.86 4.54006C19.2577 3.84757 18.4573 3.35675 17.567 3.13398C16.6767 2.91122 15.7395 2.96725 14.8821 3.29451C14.0247 3.62177 13.2884 4.20446 12.773 4.96377C12.2575 5.72309 11.9877 6.62239 12 7.54006V8.54006C10.2426 8.58562 8.50127 8.19587 6.93101 7.4055C5.36074 6.61513 4.01032 5.44869 3 4.01006C3 4.01006 -1 13.0101 8 17.0101C5.94053 18.408 3.48716 19.109 1 19.0101C10 24.0101 21 19.0101 21 7.51006C20.9991 7.23151 20.9723 6.95365 20.92 6.68006C21.9406 5.67355 23 3.01006 23 3.01006Z"
                    stroke="#E1D4C9"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
              </a>
              <a
                class="social-icon-box flex-row justify-center align-center"
                href="https://www.instagram.com/"
                target="_blank"
              >
                <svg
                  width="24"
                  height="24"
                  viewBox="0 0 24 24"
                  fill="none"
                  xmlns="http://www.w3.org/2000/svg"
                >
                  <path
                    d="M12 16C14.2091 16 16 14.2091 16 12C16 9.79086 14.2091 8 12 8C9.79086 8 8 9.79086 8 12C8 14.2091 9.79086 16 12 16Z"
                    stroke="#E1D4C9"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                  <path
                    d="M3 16V8C3 5.23858 5.23858 3 8 3H16C18.7614 3 21 5.23858 21 8V16C21 18.7614 18.7614 21 16 21H8C5.23858 21 3 18.7614 3 16Z"
                    stroke="#E1D4C9"
                  />
                  <path
                    d="M17.5 6.51L17.51 6.49889"
                    stroke="#E1D4C9"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
              </a>
              <a
                class="social-icon-box flex-row justify-center align-center"
                href="https://www.facebook.com/"
                target="_blank"
              >
                <svg
                  width="24"
                  height="24"
                  viewBox="0 0 24 24"
                  fill="none"
                  xmlns="http://www.w3.org/2000/svg"
                >
                  <path
                    d="M17 2H14C12.6739 2 11.4021 2.52678 10.4645 3.46447C9.52678 4.40215 9 5.67392 9 7V10H6V14H9V22H13V14H16L17 10H13V7C13 6.73478 13.1054 6.48043 13.2929 6.29289C13.4804 6.10536 13.7348 6 14 6H17V2Z"
                    stroke="#E1D4C9"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
              </a>
            </div>
          </div>
          <div class="contact-info flex-col gap-40">
            <h3 class="contact-info-name heading-3-font weight-600 light-txt">
              Contact us
            </h3>
            <div
              class="contact-items flex-col gap-16 medium-font light-txt weight-600"
            >
              <a
                class="location contact-item hover-underline-animation-footer"
                href="https://www.google.ge/maps/@41.724172,44.7370823,17z?entry=ttu"
                target="_blank"
              >
                <img src="assets/pin-alt.svg" alt="location icon" />
                <p class="medium-font light-txt weight-600">
                  8558 Green Rd., LA
                </p>
              </a>
              <a
                class="phone-number contact-item hover-underline-animation-footer"
                href="tel:+16035550123"
              >
                <img src="assets/phone.svg" alt="phone icon" />
                <p class="medium-font light-txt weight-600">
                  +1 (603) 555-0123
                </p>
              </a>
              <div class="time contact-item">
                <img src="assets/clock.svg" alt="clock icon" />
                <p class="medium-font light-txt weight-600">
                  Mon-Sat: 9:00 AM – 23:00 PM
                </p>
              </div>
            </div>
          </div>
        </footer>
      </div>
    </div>
  </body>
</html>
